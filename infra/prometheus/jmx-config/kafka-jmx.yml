---
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>Count
    name: kafka_server_broker_topic_$1_total
    labels:
      topic: "$2"

  - pattern: kafka.server<type=BrokerTopicMetrics, name=(.+)><>Count
    name: kafka_server_broker_$1_total

  - pattern: kafka.server<type=ReplicaManager, name=(.+)><>Value
    name: kafka_server_replica_manager_$1

  - pattern: kafka.controller<type=KafkaController, name=(.+)><>Value
    name: kafka_controller_$1

  - pattern: kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(.+)><>Count
    name: kafka_network_requests_total
    labels:
      request: "$1"

  - pattern: kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate
    name: kafka_server_request_handler_avg_idle_percent

  - pattern: kafka.log<type=LogFlushStats, name=LogFlushRateAndTimeMs><>Count
    name: kafka_log_flush_rate_total

  # Catch-all exports *all* remaining JMX beans → huge / slow scrapes and frequent
  # Prometheus "context deadline exceeded" on kafka:7071. Keep disabled unless you
  # need a full JMX dump for debugging (and raise scrape_timeout further if needed).
  # - pattern: ".*"
